services:

  namenode:
    image: apache/hadoop:3.5.0
    hostname: namenode
    user: root
    command: ["hdfs", "namenode"]
    ports:
      - "9870:9870"
      - "9000:9000"
    environment:
      CORE-SITE.XML_fs.defaultFS: hdfs://namenode:9000
      HDFS-SITE.XML_dfs.replication: "1"
      HDFS-SITE.XML_dfs.namenode.rpc-bind-host: "0.0.0.0"
      HDFS-SITE.XML_dfs.namenode.http-bind-host: "0.0.0.0"
      HDFS-SITE.XML_dfs.namenode.name.dir: file:///opt/hadoop/data/nameNode
      ENSURE_NAMENODE_DIR: /opt/hadoop/data/nameNode/current
    volumes:
      - hadoop_namenode:/opt/hadoop/data/nameNode
    networks:
      - ktdl-network

  datanode:
    image: apache/hadoop:3.5.0
    hostname: datanode
    user: root
    command: ["hdfs", "datanode"]
    depends_on:
      - namenode
    environment:
      CORE-SITE.XML_fs.defaultFS: hdfs://namenode:9000
      HDFS-SITE.XML_dfs.replication: "1"
      HDFS-SITE.XML_dfs.datanode.address: "0.0.0.0:9866"
      HDFS-SITE.XML_dfs.datanode.http.address: "0.0.0.0:9864"
      HDFS-SITE.XML_dfs.datanode.data.dir: file:///opt/hadoop/data/dataNode
    volumes:
      - hadoop_datanode:/opt/hadoop/data/dataNode
    networks:
      - ktdl-network

  resourcemanager:
    image: apache/hadoop:3.5.0
    hostname: resourcemanager
    command: ["yarn", "resourcemanager"]
    ports:
      - "8088:8088"
    depends_on:
      - namenode
      - datanode
    environment:
      CORE-SITE.XML_fs.defaultFS: hdfs://namenode:9000
      YARN-SITE.XML_yarn.resourcemanager.hostname: resourcemanager
      YARN-SITE.XML_yarn.nodemanager.aux-services: mapreduce_shuffle
    networks:
      - ktdl-network

  nodemanager:
    image: apache/hadoop:3.5.0
    hostname: nodemanager
    command: ["yarn", "nodemanager"]
    depends_on:
      - resourcemanager
    environment:
      CORE-SITE.XML_fs.defaultFS: hdfs://namenode:9000
      YARN-SITE.XML_yarn.resourcemanager.hostname: resourcemanager
      YARN-SITE.XML_yarn.nodemanager.aux-services: mapreduce_shuffle
    networks:
      - ktdl-network

volumes:
  hadoop_namenode:
    driver: local
  hadoop_datanode:
    driver: local

networks:
  ktdl-network:
    external: true
