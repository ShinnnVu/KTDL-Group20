services:
  spark:
    image: apache/spark:latest
    hostname: spark
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master", "--host", "0.0.0.0", "--port", "7077", "--webui-port", "8080"]
    ports:
      - '8080:8080'
      - '7077:7077'
    networks:
      - ktdl-network

  spark-worker:
    image: apache/spark:latest
    hostname: spark-worker
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark:7077", "--webui-port", "8081"]
    depends_on:
      - spark
    networks:
      - ktdl-network

networks:
  ktdl-network:
    external: true
